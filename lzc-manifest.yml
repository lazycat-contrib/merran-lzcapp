application:
  subdomain: merran
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://merran:3000/
  injects:
    # Recipe photo import and data export use native file pickers, which the
    # store requires to route through the LazyCat cloud drive.
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  merran:
    # ghcr.io/merran-app/merran:next
    # upstream: ghcr.io/merran-app/merran:next@sha256:53b32f2835a3f7aaa4739dda8484bb209a9809fb8238ced9bac8969f5b7cf8f9
    image: ghcr.io/merran-app/merran:next@sha256:53b32f2835a3f7aaa4739dda8484bb209a9809fb8238ced9bac8969f5b7cf8f9
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/data
