application:
  subdomain: merran
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://merran:3000/
  injects:
    # Recipe photo import and data export use native file pickers, which the
    # store requires to route through the LazyCat cloud drive.
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  merran:
    # ghcr.io/merran-app/merran:next
    # upstream: ghcr.io/merran-app/merran:next@sha256:27094c20dd8144b4861340d3afb70e6c0595cb50418f3b9b0e77e37762160b94
    image: ghcr.io/merran-app/merran:next@sha256:27094c20dd8144b4861340d3afb70e6c0595cb50418f3b9b0e77e37762160b94
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/data
