application:
  subdomain: merran
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://merran:3000/
  injects:
    # Recipe photo import and data export use native file pickers, which the
    # store requires to route through the LazyCat cloud drive.
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  merran:
    # ghcr.io/merran-app/merran:next
    # upstream: ghcr.io/merran-app/merran:next@sha256:a8c7672960f5f1d481daa337c243b3769a86371a294c7d87ce06aa8a111d5e1c
    image: ghcr.io/merran-app/merran:next@sha256:a8c7672960f5f1d481daa337c243b3769a86371a294c7d87ce06aa8a111d5e1c
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/data
