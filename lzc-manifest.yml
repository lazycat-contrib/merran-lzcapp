application:
  subdomain: merran
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://merran:3000/
  injects:
    # Recipe photo import and data export use native file pickers, which the
    # store requires to route through the LazyCat cloud drive.
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  merran:
    # ghcr.io/merran-app/merran:next
    # upstream: ghcr.io/merran-app/merran:next@sha256:0743ae92f692bba6ec331a09ffbd8e5f4a9710efadb5ca5370a57acf5039b88a
    image: ghcr.io/merran-app/merran:next@sha256:0743ae92f692bba6ec331a09ffbd8e5f4a9710efadb5ca5370a57acf5039b88a
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/data
